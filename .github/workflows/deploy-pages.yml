name: Deploy secure handbook site

# Fail closed: deployment is manual and remains blocked until the repository
# variable HANDBOOK_DEPLOYMENT_APPROVED is explicitly set to "true" after the
# repository and hosting access controls have been approved by Security.
on:
  workflow_dispatch:
    inputs:
      change_ticket:
        description: Approved security/change ticket reference
        required: true
        type: string

permissions: {}

concurrency:
  group: secure-handbook-pages
  cancel-in-progress: true

jobs:
  authorization:
    name: Verify deployment authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce security approval
        env:
          DEPLOYMENT_APPROVED: ${{ vars.HANDBOOK_DEPLOYMENT_APPROVED }}
          CHANGE_TICKET: ${{ inputs.change_ticket }}
          DISPATCH_REF: ${{ github.ref }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$DEPLOYMENT_APPROVED" != "true" ]; then
            echo "::error::Deployment is blocked. Security must approve the hosting access-control model first."
            exit 1
          fi
          if [ -z "$CHANGE_TICKET" ]; then
            echo "::error::An approved security/change ticket reference is required."
            exit 1
          fi
          if [ "$DISPATCH_REF" != "$EXPECTED_REF" ]; then
            echo "::error::Deployment must be dispatched from the protected default branch."
            exit 1
          fi

  build:
    name: Build reviewed static artifact
    needs: authorization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run security checks
        run: node scripts/security-check.mjs

      - name: Assemble static site
        env:
          HANDBOOK_DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/build-static-artifact.mjs

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload reviewed artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public

  deploy:
    name: Deploy approved artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
