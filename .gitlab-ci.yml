# GitLab Pages — Auto deploy on push to main
# Live URL: https://internal-team8622216.gitlab.io/project-handbook

image: alpine:latest

stages:
  - deploy

pages:
  stage: deploy
  script:
    - echo "Publishing static site..."
    - mkdir -p public
    - cp index.html public/
    # Legacy redirect stubs (index.html#<page> deep links)
    - cp handbook.html ba-handbook.html pm-handbook.html qc-handbook.html public/
    # Shared assets AND the page fragments the SPA router fetches at runtime
    - cp -r assets public/
    - cp -r pages public/
    - echo "Build complete. Files in public/:"
    - ls -la public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
  only:
    - main
