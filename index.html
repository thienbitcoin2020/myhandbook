<!DOCTYPE html>
<html lang="en">
<head>
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x260aj5nmz");
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Handbook</title>
  <meta name="description" content="Internal Handbook — Project Implementation, Deployment Runbook, BA Working Flow, PM Handbook." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- Anti-FOUC: apply saved theme before first paint -->
  <script>(function(){var t=localStorage.getItem('nt_theme')||'dark';document.documentElement.setAttribute('data-theme',t)})();</script>
</head>
<body>

<!-- ===== LOGIN OVERLAY ===== -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-icon">🏦</div>
      <div class="login-brand">Handbook</div>
      <div class="login-sub">Authorized Personnel Only · Confidential</div>
    </div>
    <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off">
      <div class="login-field">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" placeholder="Enter username" autocomplete="username" required />
      </div>
      <div class="login-field">
        <label for="login-password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="Show password">👁</button>
        </div>
      </div>
      <div id="login-error" class="login-error"></div>
      <button type="submit" class="login-btn" id="login-submit">Sign in</button>
    </form>
    <div class="login-footer">🔒 Authorized Personnel Only · SBV Circular 09/2020/TT-NHNN</div>
  </div>
</div>

<!-- Mobile sidebar toggle -->
<button id="sidebar-toggle" aria-label="Toggle navigation" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</button>

<!-- Sidebar: inner HTML injected by router -->
<aside id="sidebar"></aside>

<!-- Main content: injected by router -->
<div id="app"></div>

<!-- Logout button (fixed) -->
<button id="logout-btn" onclick="handleLogout()" title="Sign out">
  <span>⎋</span> Sign out
</button>

<script src="assets/js/main.js"></script>
<script src="assets/js/router.js"></script>
</body>
</html>
