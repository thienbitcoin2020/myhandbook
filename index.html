<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-src 'none'; img-src 'self' data:; media-src 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#DA2128" />
  <meta name="referrer" content="no-referrer" />
  <title>Handbook</title>
  <meta name="description" content="Internal Handbook — Project Implementation, Deployment Runbook, BA, PM, PMO, Product Owner, Scrum Master, Solution Architect, UX/UI, QC Testing, Security & Compliance, Operations & SRE handbooks." />
  <link rel="stylesheet" href="assets/css/styles.css?v=20260712-search-footer-v3">
  <!-- Anti-FOUC: apply saved theme before first paint -->
  <script src="assets/js/theme-init.js?v=20260711-security-v1"></script>
</head>
<body>

<!-- ===== POWERHOME-INSPIRED APP BAR ===== -->
<header id="app-topbar">
  <a class="app-brand" href="#home" aria-label="Power Home Handbook home">
    <img src="assets/images/power-home-logo.png" alt="Power Home" />
  </a>
  <div class="app-context">
    <span class="app-context-title">Project Handbook</span>
    <span class="app-context-badge">Internal use</span>
  </div>

  <!-- Global full-text search: populated from the current-language fragments. -->
  <div class="global-search" id="global-search">
    <button class="global-search-mobile-trigger" id="global-search-mobile-trigger" type="button"
      aria-label="Open search" aria-controls="global-search-popover" aria-expanded="false">
      <span aria-hidden="true">⌕</span>
    </button>

    <div class="global-search-popover" id="global-search-popover">
      <label class="visually-hidden" for="global-search-input">Search the entire handbook</label>
      <div class="global-search-control">
        <span class="global-search-icon" aria-hidden="true">⌕</span>
        <input id="global-search-input" class="global-search-input" type="search"
          role="combobox" aria-autocomplete="list" aria-haspopup="listbox"
          aria-controls="global-search-results" aria-expanded="false"
          placeholder="Search the entire handbook..." autocomplete="off" spellcheck="false" />
        <button class="global-search-clear" id="global-search-clear" type="button"
          aria-label="Clear search" hidden>×</button>
        <button class="global-search-mobile-close" id="global-search-mobile-close" type="button"
          aria-label="Close search">×</button>
      </div>

      <div class="global-search-panel" id="global-search-panel" hidden>
        <div class="global-search-summary">
          <span id="global-search-status" role="status" aria-live="polite" aria-atomic="true"></span>
          <button id="global-search-close-results" type="button" aria-label="Close search results">×</button>
        </div>
        <ul class="global-search-results" id="global-search-results" role="listbox"
          aria-label="Search results"></ul>
        <div class="global-search-hint" aria-hidden="true">
          <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
          <span><kbd>Enter</kbd> Open</span>
          <span><kbd>Esc</kbd> Close</span>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Mobile sidebar toggle -->
<button id="sidebar-toggle" type="button" aria-label="Toggle navigation">
  <span></span><span></span><span></span>
</button>

<!-- Sidebar: inner HTML injected by router -->
<aside id="sidebar"></aside>

<!-- Main content: injected by router -->
<div id="app"></div>

<script src="assets/js/main.js?v=20260711-security-v1"></script>
<script src="assets/js/router.js?v=20260711-security-v1"></script>
<script src="assets/js/search.js?v=20260712-global-search-v7"></script>
</body>
</html>
